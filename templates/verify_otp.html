{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <h2>📱 Verify OTP</h2>
    <p class="small">Enter the 6-digit code sent to your email.</p>
    <form method="POST">
        <input type="text" name="otp" placeholder="6-digit code" maxlength="6" required
               style="text-align:center;letter-spacing:8px;font-size:1.3rem;font-weight:700;">
        <button type="submit" class="btn-primary">Verify</button>
    </form>
    <p style="text-align:center;margin-top:15px;">
        <a href="{{ url_for('forgot_password') }}">Resend OTP</a> |
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>
</div>
{% endblock %}
